[package]
name = "obscura-desktop"
version = "1.0.0"
description = "Obscura — Zero-Knowledge Secure Messaging"
authors = ["Obscura Network"]
license = "MIT"
repository = "https://github.com/obscura-network/obscura"
edition = "2021"

[lib]
name = "obscura_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "obscura-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
  "tray-icon",
  "native-tls",
] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
keyring = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
