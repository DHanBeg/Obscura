user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream=$upstream_addr rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ─── Performance ──────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 50M;  # Medya yükleme limiti

    # ─── Güvenlik başlıkları ──────────────────────────────────────────────────
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # ─── Rate limiting ────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ─── Upstream — 5 Obscura node ────────────────────────────────────────────
    upstream obscura_nodes {
        least_conn;  # En az bağlantılı node'a yönlendir
        server node-1:8081 weight=1 max_fails=3 fail_timeout=30s;
        server node-2:8082 weight=1 max_fails=3 fail_timeout=30s;
        server node-3:8083 weight=1 max_fails=3 fail_timeout=30s;
        server node-4:8084 weight=1 max_fails=3 fail_timeout=30s;
        server node-5:8085 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ─── WebSocket upstream (sticky — aynı node'a yönlendir) ─────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ─── HTTP Server (dev + redirect) ────────────────────────────────────────
    server {
        listen 8080;
        server_name _;

        # CORS preflight
        location / {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                return 204;
            }

            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

            proxy_pass http://obscura_nodes;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            limit_req zone=api burst=50 nodelay;
            limit_conn conn_limit 20;
        }

        # Auth endpoints — daha sıkı rate limit
        location /v1/auth/ {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://obscura_nodes;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WebSocket — sticky routing (hash by remote IP)
        location /v1/stream {
            proxy_pass http://obscura_nodes;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;   # 1 saat WebSocket timeout
            proxy_send_timeout 3600s;
        }

        # Node status (rate limit yok)
        location /v1/node/status {
            proxy_pass http://obscura_nodes;
            proxy_http_version 1.1;
        }
    }

    # ─── HTTPS Server (prod) ──────────────────────────────────────────────────
    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/obscura.crt;
        ssl_certificate_key /etc/nginx/ssl/obscura.key;
        ssl_protocols TLSv1.3 TLSv1.2;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_stapling on;
        ssl_stapling_verify on;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # Aynı location blokları HTTPS için
        location / {
            proxy_pass http://obscura_nodes;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            limit_req zone=api burst=50 nodelay;
        }

        location /v1/stream {
            proxy_pass http://obscura_nodes;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
