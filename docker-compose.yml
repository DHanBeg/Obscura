version: "3.9"

# ─── Obscura Ağı — 5 Node + Altyapı ──────────────────────────────────────────
# Tüm servisler kendi ağında, sıfır dış bağımlılık.
#
# Mimari:
#   nginx (8080 HTTP / 8443 HTTPS) → load balancer + WebSocket proxy
#     ├── node-1 (8081) — birincil
#     ├── node-2 (8082)
#     ├── node-3 (8083)
#     ├── node-4 (8084)
#     └── node-5 (8085)
#   frontend   (3000)
#   minio      (9000/9001) — self-hosted S3
#   coturn     (3478/5349) — self-hosted STUN/TURN
#   prometheus (9090)     — self-hosted metrik

networks:
  obscura-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
  node5-data:
  minio-data:
  prometheus-data:
  coturn-data:
  mls-bin:
  grafana-data:
  postgres-data:

configs:
  nginx_config:
    file: ./nginx/nginx.conf
  prometheus_config:
    file: ./prometheus/prometheus.yml
  coturn_config:
    file: ./coturn/turnserver.conf

secrets:
  ssl_cert:
    file: ./nginx/ssl/obscura.crt
  ssl_key:
    file: ./nginx/ssl/obscura.key

# ─── ORTAK NODE AYARLARI ──────────────────────────────────────────────────────
x-node-common: &node-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  networks:
    - obscura-net
  env_file:
    - .env
  environment:
    SMS_PROVIDER: "log"         # dev: OTP response'a yaz, gerçek SMS gönderme
    OBSCURA_ENV: "development"  # dev_otp endpoint aktif, strict secret kontrolü yok
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:$$PORT/v1/node/status || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 20s

services:
  # ─── CRYPTO BUILDER (Rust MLS CLI) ───────────────────────────────────────
  # Rust'ta derlenmiş mls-cli binary'sini Linux için oluşturur ve paylaşır.
  # Node servisleri bu binary'ye MLS_CLI_PATH=/mls-bin/mls-cli üzerinden erişir.
  crypto-builder:
    image: rust:1.78-alpine
    container_name: obscura-crypto-builder
    volumes:
      - ./crypto:/build:ro
      - mls-bin:/output
    command: >
      sh -c "apk add --no-cache musl-dev &&
             cd /build &&
             cargo build --release --bin mls-cli 2>&1 &&
             cp target/release/mls-cli /output/mls-cli &&
             chmod +x /output/mls-cli &&
             echo 'MLS CLI hazir: /output/mls-cli'"
    networks:
      - obscura-net

  # ─── POSTGRES (5 node için ayrı database — HAZIRLIK, sqlite hâlâ varsayılan) ─
  # OBSCURA_DB_DRIVER burada set edilmiyor (default: sqlite) — bu servis sadece
  # Postgres yolunu deneyebilir hale getiriyor. internal/db.Init() zaten
  # OBSCURA_DB_DRIVER=postgres'i şema/migration portu tamamlanana kadar
  # reddediyor (bkz. internal/db/database.go).
  postgres:
    image: postgres:16-alpine
    container_name: obscura-postgres
    restart: unless-stopped
    networks:
      - obscura-net
    environment:
      POSTGRES_USER: obscura
      POSTGRES_PASSWORD: "obscura-secret-CHANGE-IN-PRODUCTION"
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-multi-db.sql:/docker-entrypoint-initdb.d/init-multi-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obscura"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── NODE 1 ───────────────────────────────────────────────────────────────
  # node-1 bootstrap node'udur — BOOTSTRAP_PEERS boş bırakılır.
  # Diğer node'lar node-1'i bootstrap olarak kullanır.
  # İlk başlatmadan sonra node-1'in peer ID'sini öğrenmek için:
  #   docker logs obscura-node-1 2>&1 | grep "P2P node baslatildi"
  # ve BOOTSTRAP_PEERS değerini güncelle.
  node-1:
    <<: *node-common
    container_name: obscura-node-1
    environment:
      PORT: "8081"
      DATA_DIR: /app/data
      NODE_ID: node-1
      OBSCURA_DB_DSN: "postgres://obscura:obscura-secret-CHANGE-IN-PRODUCTION@postgres:5432/node1_db?sslmode=disable"
      NODE_PEERS: "node-2:8082,node-3:8083,node-4:8084,node-5:8085"
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: obscura-media
      MLS_CLI_PATH: /app/mls-bin/mls-cli
      # P2P ayarları
      P2P_ENABLED: "false"
      P2P_LISTEN_QUIC: "/ip4/0.0.0.0/udp/9001/quic-v1"
      P2P_KEY_PATH: "/app/data/p2p_identity.key"
      BOOTSTRAP_PEERS: ""
      P2P_ZK_AUTH: "false"
    ports:
      - "8081:8081"
      - "9011:9001/udp"   # P2P QUIC (node-1)
    volumes:
      - node1-data:/app/data
      - mls-bin:/app/mls-bin:ro
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ─── NODE 2 ───────────────────────────────────────────────────────────────
  # BOOTSTRAP_PEERS: node-1'in peer ID'si ile doldurulmalı (ZORUNLU — otomatik
  # türetme yok, peer ID'siz adres bootstrap'ta hiçbir zaman bağlanamaz).
  # Format (QUIC — tek gerçek transport, TCP register edilmemiş):
  #   /dns4/node-1/udp/9001/quic-v1/p2p/<NODE1_PEER_ID>
  node-2:
    <<: *node-common
    container_name: obscura-node-2
    environment:
      PORT: "8082"
      DATA_DIR: /app/data
      NODE_ID: node-2
      OBSCURA_DB_DSN: "postgres://obscura:obscura-secret-CHANGE-IN-PRODUCTION@postgres:5432/node2_db?sslmode=disable"
      NODE_PEERS: "node-1:8081,node-3:8083,node-4:8084,node-5:8085"
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: obscura-media
      MLS_CLI_PATH: /app/mls-bin/mls-cli
      # P2P ayarları
      P2P_ENABLED: "false"
      P2P_LISTEN_QUIC: "/ip4/0.0.0.0/udp/9001/quic-v1"
      P2P_KEY_PATH: "/app/data/p2p_identity.key"
      BOOTSTRAP_PEERS: ""
      P2P_ZK_AUTH: "false"
    ports:
      - "8082:8082"
      - "9021:9001/udp"   # P2P QUIC (node-2)
    volumes:
      - node2-data:/app/data
      - mls-bin:/app/mls-bin:ro
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ─── NODE 3 ───────────────────────────────────────────────────────────────
  node-3:
    <<: *node-common
    container_name: obscura-node-3
    environment:
      PORT: "8083"
      DATA_DIR: /app/data
      NODE_ID: node-3
      OBSCURA_DB_DSN: "postgres://obscura:obscura-secret-CHANGE-IN-PRODUCTION@postgres:5432/node3_db?sslmode=disable"
      NODE_PEERS: "node-1:8081,node-2:8082,node-4:8084,node-5:8085"
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: obscura-media
      MLS_CLI_PATH: /app/mls-bin/mls-cli
      # P2P ayarları
      P2P_ENABLED: "false"
      P2P_LISTEN_QUIC: "/ip4/0.0.0.0/udp/9001/quic-v1"
      P2P_KEY_PATH: "/app/data/p2p_identity.key"
      BOOTSTRAP_PEERS: ""
      P2P_ZK_AUTH: "false"
    ports:
      - "8083:8083"
      - "9031:9001/udp"   # P2P QUIC (node-3)
    volumes:
      - node3-data:/app/data
      - mls-bin:/app/mls-bin:ro
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ─── NODE 4 ───────────────────────────────────────────────────────────────
  node-4:
    <<: *node-common
    container_name: obscura-node-4
    environment:
      PORT: "8084"
      DATA_DIR: /app/data
      NODE_ID: node-4
      OBSCURA_DB_DSN: "postgres://obscura:obscura-secret-CHANGE-IN-PRODUCTION@postgres:5432/node4_db?sslmode=disable"
      NODE_PEERS: "node-1:8081,node-2:8082,node-3:8083,node-5:8085"
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: obscura-media
      MLS_CLI_PATH: /app/mls-bin/mls-cli
      # P2P ayarları
      P2P_ENABLED: "false"
      P2P_LISTEN_QUIC: "/ip4/0.0.0.0/udp/9001/quic-v1"
      P2P_KEY_PATH: "/app/data/p2p_identity.key"
      BOOTSTRAP_PEERS: ""
      P2P_ZK_AUTH: "false"
    ports:
      - "8084:8084"
      - "9041:9001/udp"   # P2P QUIC (node-4)
    volumes:
      - node4-data:/app/data
      - mls-bin:/app/mls-bin:ro
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ─── NODE 5 ───────────────────────────────────────────────────────────────
  node-5:
    <<: *node-common
    container_name: obscura-node-5
    environment:
      PORT: "8085"
      DATA_DIR: /app/data
      NODE_ID: node-5
      OBSCURA_DB_DSN: "postgres://obscura:obscura-secret-CHANGE-IN-PRODUCTION@postgres:5432/node5_db?sslmode=disable"
      NODE_PEERS: "node-1:8081,node-2:8082,node-3:8083,node-4:8084"
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: obscura-media
      MLS_CLI_PATH: /app/mls-bin/mls-cli
      # P2P ayarları
      P2P_ENABLED: "false"
      P2P_LISTEN_QUIC: "/ip4/0.0.0.0/udp/9001/quic-v1"
      P2P_KEY_PATH: "/app/data/p2p_identity.key"
      BOOTSTRAP_PEERS: ""
      P2P_ZK_AUTH: "false"
    ports:
      - "8085:8085"
      - "9051:9001/udp"   # P2P QUIC (node-5)
    volumes:
      - node5-data:/app/data
      - mls-bin:/app/mls-bin:ro
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ─── NGINX LOAD BALANCER ──────────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile_inline: |
        FROM nginx:1.27-alpine
        COPY nginx.conf /etc/nginx/nginx.conf
        COPY ssl/ /etc/nginx/ssl/
    container_name: obscura-nginx
    restart: unless-stopped
    networks:
      - obscura-net
    ports:
      - "8080:8080"   # HTTP (dev/internal)
      - "8443:8443"   # HTTPS (prod)
    depends_on:
      - node-1
      - node-2
      - node-3
      - node-4
      - node-5

  # ─── FRONTEND ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: obscura-frontend
    restart: unless-stopped
    networks:
      - obscura-net
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
      NEXT_PUBLIC_WS_URL: "ws://localhost:8080"
    depends_on:
      - nginx

  # ─── MINIO (Self-hosted S3) ───────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: obscura-minio
    restart: unless-stopped
    networks:
      - obscura-net
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ─── MINIO INIT ───────────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: obscura-minio-init
    networks:
      - obscura-net
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set obs http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY} &&
        mc mb obs/obscura-media --ignore-existing &&
        mc anonymous set download obs/obscura-media/avatar &&
        echo 'MinIO: bucket hazir'
      "
    restart: on-failure

  # ─── COTURN (Self-hosted STUN/TURN — WebRTC) ──────────────────────────────
  coturn:
    build:
      context: ./coturn
      dockerfile_inline: |
        FROM coturn/coturn:4.6
        COPY turnserver.conf /etc/turnserver.conf
    container_name: obscura-coturn
    restart: unless-stopped
    networks:
      - obscura-net
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/udp"
      - "5349:5349/tcp"
    volumes:
      - coturn-data:/var/lib/coturn
    command: -c /etc/turnserver.conf

  # ─── PROMETHEUS ───────────────────────────────────────────────────────────
  prometheus:
    build:
      context: ./prometheus
      dockerfile_inline: |
        FROM prom/prometheus:v2.48.0
        COPY prometheus.yml /etc/prometheus/prometheus.yml
    container_name: obscura-prometheus
    restart: unless-stopped
    networks:
      - obscura-net
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"

  # ─── GRAFANA ──────────────────────────────────────────────────────────────
  grafana:
    build:
      context: ./monitoring/grafana
      dockerfile_inline: |
        FROM grafana/grafana:10.4.3
        COPY provisioning/ /etc/grafana/provisioning/
        COPY dashboards/ /etc/grafana/dashboards/
    container_name: obscura-grafana
    restart: unless-stopped
    networks:
      - obscura-net
    ports:
      - "3001:3000"   # 3000 Next.js'te kullanılıyor
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=obscura_grafana
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
