global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    monitor: 'obscura-network'

rule_files:
  - "alerts.yml"

scrape_configs:
  # Obscura Node'ları
  - job_name: 'obscura-nodes'
    static_configs:
      - targets:
          - 'node-1:8081'
          - 'node-2:8082'
          - 'node-3:8083'
          - 'node-4:8084'
          - 'node-5:8085'
    metrics_path: '/v1/metrics'
    scrape_interval: 15s

  # Nginx
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:8080']
    metrics_path: '/nginx_status'

  # MinIO
  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
    metrics_path: '/minio/v2/metrics/cluster'
    scheme: http
