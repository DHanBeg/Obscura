# Obscura — coturn STUN/TURN Sunucu Yapılandırması
# WebRTC P2P bağlantıları için NAT traversal sağlar
# Dış bağımlılık yok — tamamen self-hosted

# ─── Temel Ayarlar ────────────────────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349
alt-listening-port=3479

# Dış IP (gerçek dağıtımda sunucu IP'si ile değiştir)
# external-ip=YOUR_PUBLIC_IP

# ─── Authentication ───────────────────────────────────────────────────────────
# HMAC-SHA1 tabanlı short-term credential
# Obscura backend credential üretir, istemciye iletir
use-auth-secret
static-auth-secret=obscura-turn-secret-CHANGE-IN-PRODUCTION
realm=obscura.network

# ─── Relay Adresi ─────────────────────────────────────────────────────────────
relay-threads=4
min-port=49152
max-port=65535

# ─── TLS ──────────────────────────────────────────────────────────────────────
# prod'da gerçek sertifika yolu ile değiştir
cert=/var/lib/coturn/ssl/obscura.crt
pkey=/var/lib/coturn/ssl/obscura.key
cipher-list="ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384"
no-sslv3
no-tlsv1
no-tlsv1_1

# ─── Güvenlik ─────────────────────────────────────────────────────────────────
# Yalnızca UDP relay (TURN over TCP de desteklenir ama UDP daha verimli)
no-tcp-relay
# Loopback'e relay yok
no-loopback-peers
# Multicast'e relay yok
no-multicast-peers
# STUN-only modu yok (TURN da gerekli)
# stun-only

# ─── Performans ───────────────────────────────────────────────────────────────
proc-user=turnserver
proc-group=turnserver
log-file=/var/log/coturn/turnserver.log
verbose
fingerprint
