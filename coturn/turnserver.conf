# Obscura — coturn STUN/TURN Sunucu Yapılandırması
# WebRTC P2P bağlantıları için NAT traversal sağlar
# Dış bağımlılık yok — tamamen self-hosted

# ─── Temel Ayarlar ────────────────────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349
alt-listening-port=3479

# Dış IP (gerçek dağıtımda sunucu IP'si ile değiştir)
# external-ip=YOUR_PUBLIC_IP

# ─── Authentication ───────────────────────────────────────────────────────────
# HMAC-SHA1 tabanlı short-term credential
# Obscura backend credential üretir, istemciye iletir
use-auth-secret
static-auth-secret=obscura-turn-secret-CHANGE-IN-PRODUCTION
realm=obscura.network

# ─── Relay Adresi ─────────────────────────────────────────────────────────────
relay-threads=4
min-port=49152
max-port=65535

# ─── TLS ──────────────────────────────────────────────────────────────────────
# TLS dev ortamında devre dışı — prod'da cert/pkey ekle
# cert=/etc/coturn/ssl/obscura.crt
# pkey=/etc/coturn/ssl/obscura.key

# ─── Güvenlik ─────────────────────────────────────────────────────────────────
no-tcp-relay
no-multicast-peers

# ─── Performans ───────────────────────────────────────────────────────────────
verbose
fingerprint
