version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      go-deps: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      next: { patterns: ["next", "react", "react-dom"] }
      tailwind: { patterns: ["tailwindcss", "@tailwindcss/*"] }
      types: { patterns: ["@types/*"] }
      everything-else: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /mobile
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      tauri: { patterns: ["tauri*"] }

  - package-ecosystem: cargo
    directory: /crypto
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
